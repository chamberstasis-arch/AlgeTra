<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgeTra</title>
<style>
  :root { --bg:#fafaf9; --card:#fff; --line:#e7e5e4; --ink:#1c1917; --mut:#78716c; --acc:#2f5fb3; --ok:#2f9e63; --warn:#d99a1e; --bad:#c2410c; --r:12px; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:6px; max-width:920px; margin:0 auto; padding:22px 20px 8px; }
  header h1 { font-size:18px; font-weight:650; letter-spacing:-.01em; margin:0; flex:1; }
  main { max-width:920px; margin:0 auto; padding:8px 20px 80px; }
  h2 { font-size:15px; font-weight:600; margin:0 0 12px; }
  .muted { color:var(--mut); } .small { font-size:13px; }
  a { color:var(--acc); }
  button, .btn { font:inherit; font-size:14px; padding:7px 14px; border:1px solid var(--line); background:var(--card); border-radius:9px; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px; transition:border-color .12s, background .12s; }
  button:hover, .btn:hover { border-color:#c7c3be; }
  button.primary, .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.primary:hover, .btn.primary:hover { background:#000; }
  button.ghost, .btn.ghost { border-color:transparent; background:transparent; color:var(--mut); padding:7px 8px; }
  button.ghost:hover, .btn.ghost:hover { color:var(--ink); border-color:transparent; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=text], input[type=number], select { width:100%; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid #cddcf5; border-color:var(--acc); }
  input[type=color] { width:100%; height:36px; padding:2px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  label { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); }
  .banner { padding:10px 14px; border-radius:var(--r); margin-bottom:16px; background:#fef3c7; color:#78510a; font-size:14px; }

  /* Subir */
  .drop { border:1.5px dashed #d6d3d1; border-radius:var(--r); padding:34px 20px; text-align:center; cursor:pointer; background:var(--card); transition:border-color .12s, background .12s; }
  .drop:hover, .drop.over { border-color:var(--acc); background:#f5f8fe; }
  .drop b { font-weight:600; display:block; font-size:16px; }
  .drop span { color:var(--mut); font-size:13px; }
  .up-row { display:flex; gap:10px; align-items:center; margin:10px 0 0; }
  .up-row input { max-width:300px; }
  .msg { margin-top:10px; font-size:13px; } .msg .w { color:var(--bad); }

  /* Entregas */
  .list { display:flex; flex-direction:column; gap:10px; margin-top:28px; }
  .row-card { display:flex; align-items:center; gap:16px; padding:14px 16px; cursor:pointer; }
  .row-card:hover { border-color:#c7c3be; }
  .row-card .t { flex:1; min-width:0; }
  .row-card .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:5px; border-radius:3px; background:#eeece9; overflow:hidden; display:flex; margin:7px 0 4px; }
  .bar i { display:block; height:100%; } .bar .g { background:var(--ok); } .bar .a { background:var(--warn); } .bar .b { background:#93b3e6; }
  .acts { display:flex; gap:6px; align-items:center; flex:none; }
  .empty { text-align:center; padding:40px 0; color:var(--mut); }

  /* Cabecera de vista */
  .back { margin:0 0 6px -8px; }
  .vhead { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .vhead .t { flex:1; min-width:0; }
  .vhead h2 { font-size:20px; margin:0; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--mut); padding:9px 12px; margin-bottom:-1px; white-space:nowrap; }
  .tabs button:hover { color:var(--ink); }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }

  /* Hojas */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; }
  .thumb { cursor:pointer; position:relative; }
  .thumb img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:9px; border:1px solid var(--line); background:#eeece9; display:block; }
  .thumb:hover img { border-color:#a8a29e; }
  .thumb .l { font-size:12px; color:var(--mut); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { position:absolute; top:7px; right:7px; width:11px; height:11px; border-radius:50%; border:2px solid #fff; background:#a8a29e; }
  .dot.procesadas { background:var(--ok); } .dot.revision { background:var(--warn); } .dot.en_proceso { background:var(--acc); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .legend { display:flex; gap:14px; font-size:12.5px; color:var(--mut); margin:0 0 12px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; background:#a8a29e; }
  .legend .procesadas { background:var(--ok); } .legend .revision { background:var(--warn); } .legend .en_proceso { background:var(--acc); }

  /* Vistas */
  .view { background:var(--card); border:1px solid var(--line); border-radius:var(--r); min-height:200px; overflow:hidden; }
  .view img { max-width:100%; display:block; margin:0 auto; }
  .view iframe { width:100%; height:78vh; border:0; }
  .pad { padding:16px; }
  textarea.ed { width:100%; height:58vh; font:13px/1.55 ui-monospace, Consolas, monospace; padding:12px; border:1px solid var(--line); border-radius:9px; resize:vertical; }
  .lint-e { color:var(--bad); } .lint-w { color:#9a6b0a; }
  .note { font-size:13px; color:var(--mut); margin:10px 0 0; }
  ul.clean { margin:6px 0 0; padding-left:18px; } ul.clean li { margin:2px 0; }

  /* Estilo */
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:6px 14px; border-radius:20px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .fields { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px 14px; margin-top:14px; }
  .fields .full { grid-column:1/-1; font-size:13px; color:var(--mut); margin:8px 0 -4px; font-weight:600; }
  .fields label.chk { display:flex; align-items:center; gap:8px; color:var(--ink); font-size:14px; margin:0; padding-top:22px; }
  details { margin-top:14px; } summary { cursor:pointer; color:var(--mut); font-size:14px; padding:4px 0; } summary:hover { color:var(--ink); }
  .foot { display:flex; align-items:center; gap:12px; margin-top:18px; }
  @media (max-width:640px) { .row-card { flex-wrap:wrap; } .acts { width:100%; } }
</style>
</head>
<body>
<header>
  <h1>AlgeTra</h1>
  <button class="ghost" id="btnPrompt" title="Una hoja y se detiene">Prompt: una hoja</button>
  <button class="ghost" id="btnLote" title="Hasta 5 hojas seguidas y reporta una tabla">Prompt: lote</button>
  <button class="ghost" id="btnOrq" title="Un solo agente que reparte hojas a 4 subagentes en paralelo">Prompt: orquestador</button>
  <button class="ghost" id="btnCon" title="Revisión contra el enunciado: matrices, operaciones, figuras y flechas">Prompt: contraste</button>
</header>
<main>
  <div id="tools"></div>

  <!-- Lista -->
  <div id="vLista">
    <div class="drop" id="drop"><b>Suelta aquí un ZIP, PDF o fotos</b><span>o haz clic para elegir · ZIP, PDF, DOCX, JPG, PNG, HEIC</span></div>
    <input type="file" id="file" multiple hidden accept="image/*,.pdf,.docx,.doc,.odt,.rtf,.heic,.heif,.zip,application/zip">
    <div class="up-row"><input type="text" id="entrega" placeholder="Nombre de la entrega (opcional)" aria-label="Nombre de la entrega"></div>
    <div class="msg" id="upmsg"></div>
    <div class="list" id="entregas"></div>
  </div>

  <!-- Entrega -->
  <div id="vEntrega" hidden>
    <button class="ghost back" data-back>← Entregas</button>
    <div class="vhead"><div class="t"><h2 id="eTitulo"></h2><div id="eResumen" class="muted small"></div></div><div class="acts" id="eAcciones"></div></div>
    <div class="tabs" id="eTabs"></div>
    <div id="eCuerpo"></div>
  </div>

  <!-- Hoja -->
  <div id="vHoja" hidden>
    <button class="ghost back" data-back>← Volver</button>
    <div class="vhead"><div class="t"><h2 id="hTitulo"></h2><div id="hResumen" class="muted small"></div></div><div class="acts" id="hAcciones"></div></div>
    <div class="tabs" id="hTabs"></div>
    <div id="hCuerpo"></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
const q = (o) => new URLSearchParams(o).toString()
const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
const ESTADO = { por_procesar: 'Por procesar', en_proceso: 'En proceso', procesadas: 'Lista', revision: 'Por revisar' }

let state = { hojas: [], entregas: [], herramientas: {} }
let view = { t: 'lista' } // {t:'entrega', nombre, tab} | {t:'hoja', estado, id, tab, de}
let firma = ''

// ───────── Datos ─────────
async function refresh(force) {
  try { state = await (await fetch('/api/estado')).json() } catch { return }
  const f = JSON.stringify([state.hojas, state.entregas, state.herramientas])
  if (f === firma && !force) return
  firma = f
  pintarHerramientas()
  if (view.t === 'lista') pintarLista()
  else if (view.t === 'entrega') pintarEntrega(false)
  else if (view.t === 'hoja') pintarHojaCabecera()
}
const hojasDe = (nombre) => state.hojas.filter((h) => h.entrega === nombre).sort((a, b) => (a.estado === 'por_procesar') - (b.estado === 'por_procesar') || a.id.localeCompare(b.id, 'es', { numeric: true }))
const conteo = (hs) => ({ total: hs.length, porProcesar: hs.filter((h) => h.estado === 'por_procesar').length, enProceso: hs.filter((h) => h.estado === 'en_proceso').length, lista: hs.filter((h) => h.estado === 'procesadas').length, revision: hs.filter((h) => h.estado === 'revision' && !h.aprobada).length, aprobadas: hs.filter((h) => h.estado === 'revision' && h.aprobada).length })
const entregaInfo = (n) => state.entregas.find((e) => e.nombre === n)

function pintarHerramientas() {
  const t = state.herramientas || {}
  const falta = Object.entries(t).filter(([, v]) => !v).map(([k]) => k)
  $('#tools').innerHTML = falta.length ? `<div class="banner">Faltan herramientas del sistema: <b>${falta.join(', ')}</b>.${t.soffice === false ? ' Sin LibreOffice no hay vista PDF ni DOCX de entrada.' : ''}${t.pdftoppm === false ? ' Sin pdftoppm no se aceptan PDF.' : ''}</div>` : ''
}

function barra(c) {
  const p = (n) => (c.total ? (n / c.total) * 100 : 0)
  return `<div class="bar"><i class="g" style="width:${p(c.lista + c.aprobadas)}%"></i><i class="a" style="width:${p(c.revision)}%"></i><i class="b" style="width:${p(c.enProceso)}%"></i></div>`
}
function resumen(c) {
  const partes = []
  if (c.porProcesar) partes.push(`${c.porProcesar} por procesar`)
  if (c.enProceso) partes.push(`${c.enProceso} en proceso`)
  if (c.revision) partes.push(`${c.revision} por revisar`)
  const hechas = c.lista + c.aprobadas + c.revision
  return `${hechas} de ${c.total} hojas listas` + (partes.length ? ' · ' + partes.join(' · ') : '')
}

// ───────── Lista de entregas ─────────
function pintarLista() {
  const sueltas = hojasDe('')
  const tarjetas = []
  if (sueltas.length) {
    const c = conteo(sueltas)
    tarjetas.push(`<div class="card row-card" data-ent=""><div class="t"><div class="n">${c.total} hojas sin entrega</div><div class="small muted">Para obtener un solo documento con todas, ponlas en una entrega.</div></div><div class="acts"><button class="primary" data-ent="">Crear entrega con estas hojas</button></div></div>`)
  }
  for (const e of state.entregas) {
    const c = conteo(hojasDe(e.nombre))
    const cerradas = c.lista + c.aprobadas + c.revision
    tarjetas.push(`<div class="card row-card" data-ent="${esc(e.nombre)}"><div class="t"><div class="n">${esc(e.nombre)}</div>${barra(c)}<div class="small muted">${resumen(c)}</div></div>
      <div class="acts">${e.tieneDocx ? `<a class="btn" href="/api/entrega?${q({ nombre: e.nombre, tipo: 'docx', descargar: 1 })}" data-stop>DOCX</a>` : cerradas ? `<button data-ens="${esc(e.nombre)}">Ensamblar</button>` : ''}</div></div>`)
  }
  $('#entregas').innerHTML = tarjetas.join('') || '<div class="empty">Aún no hay entregas. Sube tu primer ZIP.</div>'
  document.querySelectorAll('#entregas [data-ent]').forEach((el) => el.onclick = () => abrirEntrega(el.dataset.ent))
  document.querySelectorAll('#entregas [data-stop]').forEach((el) => el.onclick = (ev) => ev.stopPropagation())
  document.querySelectorAll('#entregas [data-ens]').forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); ensamblar(b.dataset.ens, b) })
}

async function ensamblar(nombre, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Ensamblando…' }
  const r = await post('/api/ensamblar', { entrega: nombre })
  if (!r.ok) alert((await r.json()).message || 'No se pudo ensamblar')
  await refresh(true)
  if (r.ok && view.t === 'entrega') abrirEntrega(nombre, 'documento')
}

// ───────── Navegación ─────────
function mostrar(v) {
  $('#vLista').hidden = v !== 'lista'; $('#vEntrega').hidden = v !== 'entrega'; $('#vHoja').hidden = v !== 'hoja'
  window.scrollTo({ top: 0 })
}
function irLista() { view = { t: 'lista' }; mostrar('lista'); firma = ''; refresh(true) }
document.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => { if (view.t === 'hoja' && view.de !== undefined) abrirEntrega(view.de, view.deTab || 'hojas'); else irLista() })

function abrirEntrega(nombre, tab) {
  const info = entregaInfo(nombre)
  view = { t: 'entrega', nombre, tab: tab || (nombre === '' ? 'hojas' : info?.tieneDocx ? 'documento' : 'hojas') }
  estiloCargado = null
  mostrar('entrega'); pintarEntrega(true)
}

function pintarEntrega(completo) {
  const nombre = view.nombre, info = entregaInfo(nombre), hs = hojasDe(nombre), c = conteo(hs)
  $('#eTitulo').textContent = nombre === '' ? 'Hojas sin entrega' : nombre
  $('#eResumen').textContent = resumen(c)
  const cerradas = c.lista + c.aprobadas + c.revision
  $('#eAcciones').innerHTML = nombre === '' ? '' :
    (info?.tieneDocx ? `<a class="btn primary" href="/api/entrega?${q({ nombre, tipo: 'docx', descargar: 1 })}">Descargar DOCX</a><a class="btn" href="/api/entrega?${q({ nombre, tipo: 'pdf', descargar: 1 })}">PDF</a>` : '') +
    `<button id="bEns" ${cerradas ? '' : 'disabled'}>${info?.ensamblado ? 'Reensamblar' : 'Ensamblar'}</button>`
  if ($('#bEns')) $('#bEns').onclick = (ev) => ensamblar(nombre, ev.target)
  const tabs = nombre === '' ? [['hojas', 'Hojas']] : [['documento', 'Documento'], ['hojas', 'Hojas'], ['estilo', 'Estilo'], ['avisos', 'Avisos']]
  $('#eTabs').innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${k === view.tab ? 'on' : ''}">${l}</button>`).join('')
  $('#eTabs').querySelectorAll('button').forEach((b) => b.onclick = () => { view.tab = b.dataset.t; estiloCargado = null; pintarEntrega(true) })
  const cuerpo = $('#eCuerpo')
  if (view.tab === 'hojas') pintarHojas(cuerpo, nombre, hs)
  else if (!completo) return // las demás pestañas no se redibujan con el sondeo (se perdería lo que escribes)
  else if (view.tab === 'documento') {
    if (!info?.tieneDocx) cuerpo.innerHTML = `<div class="empty">Todavía no hay documento.<br>${cerradas ? 'Pulsa «Ensamblar».' : 'Se genera solo cuando el agente cierra la última hoja.'}</div>`
    else { cuerpo.innerHTML = `<div class="view"><div class="pad muted">Generando vista…</div></div>`; const f = document.createElement('iframe'); f.src = `/api/entrega?${q({ nombre, tipo: 'pdf' })}&t=${Date.now()}`; f.onload = () => cuerpo.querySelector('.pad')?.remove(); cuerpo.firstChild.appendChild(f) }
  } else if (view.tab === 'estilo') pintarEstilo(cuerpo, nombre)
  else if (view.tab === 'avisos') pintarAvisos(cuerpo, info)
}

function pintarHojas(cuerpo, nombre, hs) {
  const abierto = cuerpo.querySelector('.grid')
  const agrupar = nombre === '' && hs.length ? `<div class="card pad" style="margin-bottom:16px"><label for="agNombre">Nombre de la entrega (el documento final se llamará así)</label><div class="up-row" style="margin:0"><input type="text" id="agNombre" value="${esc(sugerirNombre())}"><button class="primary" id="agBtn">Crear entrega con ${hs.length} hojas</button></div></div>` : ''
  cuerpo.innerHTML = agrupar + (hs.length ? `<div class="legend"><span><i></i>por procesar</span><span><i class="en_proceso"></i>en proceso</span><span><i class="procesadas"></i>lista</span><span><i class="revision"></i>por revisar</span></div>` : '') +
    `<div class="grid">` + (hs.map((h) => `<div class="thumb" data-e="${esc(h.estado)}" data-id="${esc(h.id)}" title="${esc(ESTADO[h.estado])}${h.calidad && h.calidad.nivel !== 'ok' ? ' · ' + esc(h.calidad.banderas.join(', ').replace(/_/g, ' ')) : ''}"><img loading="lazy" src="/api/archivo?${q({ estado: h.estado, id: h.id, tipo: 'imagen', mini: 1 })}" alt=""><span class="dot ${h.estado === 'revision' && h.aprobada ? 'procesadas' : h.estado}"></span><div class="l">${esc(h.archivo.replace(/\.[^.]+$/, ''))}</div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">Sin hojas.</div>') + `</div>`
  cuerpo.querySelectorAll('.thumb').forEach((el) => el.onclick = () => abrirHoja(el.dataset.e, el.dataset.id, nombre, view.tab))
  if ($('#agBtn')) $('#agBtn').onclick = async () => {
    const nuevo = $('#agNombre').value.trim(); $('#agBtn').disabled = true
    const r = await post('/api/agrupar', { entrega: nuevo }); const j = await r.json()
    if (!r.ok) { alert(j.message || 'No se pudo agrupar'); $('#agBtn').disabled = false; return }
    await refresh(true); abrirEntrega(j.entrega, 'hojas')
  }
}
const sugerirNombre = () => { const n = new Date(), p = (x) => String(x).padStart(2, '0'); return `entrega-${n.getFullYear()}${p(n.getMonth() + 1)}${p(n.getDate())}` }

function pintarAvisos(cuerpo, info) {
  const e = info?.ensamblado
  if (!e) { cuerpo.innerHTML = '<div class="empty">Aún no hay ensamblado, así que no hay avisos.</div>'; return }
  const sec = (titulo, items, cls) => items?.length ? `<h2 style="margin-top:18px">${titulo}</h2><ul class="clean ${cls || ''}">${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''
  const orden = [...new Set((e.orden || []).map((o) => o.ej.split('/')[0]))]
  cuerpo.innerHTML = `<div class="card pad"><div class="small muted">${e.hojas} hojas · ${e.formulas} fórmulas · orden: ${orden.map((a) => esc(a.replace('act-', 'Act. '))).join(' → ') || '—'}</div>` +
    sec('Por revisar', e.requierenRevision, 'lint-w') + sec('Ejercicios de la base que no aparecen', e.faltantes) + sec('Fórmulas que no se pudieron convertir', (e.fallos || []).map((f) => `${f.latex} — ${f.error}`), 'lint-e') +
    (e.pendientes && e.pendientes.por_procesar + e.pendientes.en_proceso ? `<p class="note">Al ensamblar faltaban hojas por procesar.</p>` : '') +
    (!e.requierenRevision?.length && !e.faltantes?.length && !e.fallos?.length ? '<p style="margin:14px 0 0">Sin avisos.</p>' : '') + `</div>`
}

// ───────── Hoja ─────────
function abrirHoja(estado, id, de, deTab) {
  view = { t: 'hoja', estado, id, de, deTab, tab: estado === 'procesadas' || estado === 'revision' ? 'documento' : 'foto' }
  mostrar('hoja'); pintarHoja()
}
function hojaActual() { return state.hojas.find((x) => x.estado === view.estado && x.id === view.id) || {} }
function pintarHojaCabecera() {
  const h = hojaActual()
  $('#hTitulo').textContent = h.archivo || view.id
  const aviso = (h.requierenRevision || []).concat(h.dudas ? [`${h.dudas} duda(s) del agente`] : [])
  $('#hResumen').textContent = ESTADO[h.estado] + (h.calidad && h.calidad.nivel !== 'ok' ? ' · foto: ' + h.calidad.banderas.join(', ').replace(/_/g, ' ') : '') + (aviso.length && !h.aprobada ? ' · ' + aviso.join(' · ') : '') + (h.aprobada ? ' · aprobada' : '')
  const u = (tipo, d) => `/api/archivo?${q({ estado: view.estado, id: view.id, tipo, ...(d ? { descargar: 1 } : {}) })}`
  $('#hAcciones').innerHTML = view.estado === 'procesadas' || view.estado === 'revision' ? `<a class="btn primary" href="${u('docx', 1)}">DOCX</a><a class="btn" href="${u('md', 1)}">Texto</a>` : ''
}
function pintarHoja() {
  pintarHojaCabecera()
  const cerrada = view.estado === 'procesadas' || view.estado === 'revision'
  const tabs = [['foto', 'Foto']]
  if (view.estado !== 'por_procesar') tabs.push(['mejorada', 'Mejorada'], ['texto', cerrada ? 'Editar transcripción' : 'Transcripción'])
  if (cerrada) tabs.unshift(['documento', 'Documento'])
  if (!tabs.find((t) => t[0] === view.tab)) view.tab = tabs[0][0]
  $('#hTabs').innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${k === view.tab ? 'on' : ''}">${l}</button>`).join('')
  $('#hTabs').querySelectorAll('button').forEach((b) => b.onclick = () => { view.tab = b.dataset.t; pintarHoja() })
  const v = $('#hCuerpo'), u = (tipo) => `/api/archivo?${q({ estado: view.estado, id: view.id, tipo })}&t=${Date.now()}`
  if (view.tab === 'foto' || view.tab === 'mejorada') v.innerHTML = `<div class="view"><img src="${u(view.tab === 'foto' ? 'imagen' : 'mejorada')}" alt=""></div>`
  else if (view.tab === 'documento') { v.innerHTML = `<div class="view"><div class="pad muted">Generando vista…</div></div>`; const f = document.createElement('iframe'); f.src = u('pdf'); f.onload = () => v.querySelector('.pad')?.remove(); v.firstChild.appendChild(f) }
  else if (cerrada) pintarEditor(v)
  else fetch(u('md')).then((r) => r.ok ? r.text() : '').then((t) => { v.innerHTML = `<div class="view"><div class="pad" style="white-space:pre-wrap;font:13px/1.55 ui-monospace,Consolas,monospace">${esc(t) || '<span class="muted">Aún no hay transcripción.</span>'}</div></div>` })
}

async function pintarEditor(v) {
  const h = { estado: view.estado, id: view.id }
  v.innerHTML = '<div class="pad muted">Cargando…</div>'
  const texto = await (await fetch(`/api/archivo?${q({ ...h, tipo: 'md' })}&t=${Date.now()}`)).text()
  v.innerHTML = `<textarea class="ed" id="ed" spellcheck="false"></textarea>
    <div class="foot"><button class="primary" id="edSave">Guardar</button><button id="edApprove" title="Tu versión pasa a ser la referencia para medir al agente">Guardar y aprobar</button></div>
    <p class="note">Las líneas <code>&lt;!-- … --&gt;</code> son notas del agente y no salen en el documento. Al guardar se rehacen los documentos; no se procesa nada de nuevo.</p><div class="msg" id="edMsg"></div>`
  $('#ed').value = texto
  const guardar = async (aprobar) => {
    $('#edMsg').textContent = 'Guardando…'
    const r = await fetch('/api/transcripcion', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...h, texto: $('#ed').value }) })
    const j = await r.json()
    if (!r.ok) { $('#edMsg').innerHTML = `<span class="lint-e">${esc(j.message || 'No se pudo guardar')}</span>`; return }
    let html = 'Guardado.' + (j.lint.errors || []).map((e) => `<div class="lint-e">✘ ${esc(e)}</div>`).join('') + (j.lint.needsReview || []).map((e) => `<div class="lint-w">! ${esc(e)}</div>`).join('')
    if (aprobar) {
      const a = await post('/api/aprobar', h); const aj = await a.json()
      html += a.ok ? `<div>Aprobada · fórmulas exactas ${aj.metricas.equations.exact}/${aj.metricas.equations.total} · ${aj.metricas.unchanged ? 'sin correcciones' : 'corregida'}</div>` : `<div class="lint-e">${esc(aj.message || 'No se pudo aprobar')}</div>`
    }
    $('#edMsg').innerHTML = html; refresh(true)
  }
  $('#edSave').onclick = () => guardar(false); $('#edApprove').onclick = () => guardar(true)
}

// ───────── Estilo ─────────
let CAT = null, estiloActual = null, variante = 0, estiloCargado = null
const F = ['fuente', 'tamano', 'interlineado', 'margenCm', 'papel', 'alinear', 'ecuaciones', 'espaciado', 'titulo']
const G = ['paleta', 'grosor', 'cuadricula', 'ancho', 'etiquetas']
const campo = (id, label, html) => `<div><label for="${id}">${label}</label>${html}</div>`
const sel = (id, opts) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`

async function pintarEstilo(cuerpo, nombre) {
  CAT = CAT || await (await fetch('/api/estilos')).json()
  cuerpo.innerHTML = `<div class="card pad">
    <p class="muted small" style="margin:0 0 12px">Cambia solo la presentación. Lo transcrito no se toca y no se vuelve a procesar nada.</p>
    <div class="chips" id="chips">${Object.keys(CAT.presets).map((k) => `<button class="chip" data-p="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}<button class="chip" id="e_var" title="Propone un estilo distinto cada vez">Variar</button><label class="btn chip" style="margin:0;color:var(--ink)">Desde un ejemplo…<input type="file" id="e_ej" hidden accept=".docx,.pdf"></label></div>
    <div id="e_info"></div>
    <details><summary>Ajustes</summary><div class="fields">
      ${campo('e_fuente', 'Tipografía', sel('e_fuente', CAT.fuentes.map((f) => [f, f])))}
      ${campo('e_tamano', 'Tamaño (pt)', '<input type="number" id="e_tamano" step="0.5" min="10" max="14">')}
      ${campo('e_interlineado', 'Interlineado', '<input type="number" id="e_interlineado" step="0.05" min="1" max="2">')}
      ${campo('e_margenCm', 'Márgenes (cm)', '<input type="number" id="e_margenCm" step="0.1" min="1.5" max="3.5">')}
      ${campo('e_papel', 'Papel', sel('e_papel', [['A4', 'A4'], ['Carta', 'Carta']]))}
      ${campo('e_alinear', 'Texto', sel('e_alinear', [['izquierda', 'Izquierda'], ['justificado', 'Justificado']]))}
      ${campo('e_ecuaciones', 'Ecuaciones', sel('e_ecuaciones', [['izquierda', 'A la izquierda'], ['centradas', 'Centradas']]))}
      ${campo('e_espaciado', 'Espacio entre incisos', sel('e_espaciado', [['compacto', 'Compacto'], ['normal', 'Normal'], ['amplio', 'Amplio']]))}
      ${campo('e_colorTitulos', 'Color de títulos', '<input type="color" id="e_colorTitulos">')}
      ${campo('e_titulo', 'Título del documento', sel('e_titulo', [['ninguno', 'Ninguno'], ['entrega', 'Nombre de la entrega']]))}
      <label class="chk"><input type="checkbox" id="e_numeracion"> Número de página</label>
      <label class="chk"><input type="checkbox" id="e_saltoActividad"> Actividad en hoja nueva</label>
      <div class="full">Gráficas</div>
      ${campo('g_paleta', 'Paleta', sel('g_paleta', Object.entries(CAT.paletas).map(([k, p]) => [k, p.nombre])))}
      ${campo('g_grosor', 'Grosor de línea', '<input type="number" id="g_grosor" step="0.1" min="1.5" max="4">')}
      ${campo('g_cuadricula', 'Cuadrícula', sel('g_cuadricula', [['ninguna', 'Ninguna'], ['suave', 'Suave'], ['completa', 'Completa']]))}
      ${campo('g_ancho', 'Ancho (%)', '<input type="number" id="g_ancho" step="1" min="30" max="100">')}
      ${campo('g_etiquetas', 'Etiquetas', '<input type="number" id="g_etiquetas" step="1" min="11" max="20">')}
    </div></details>
    <div class="foot"><button class="primary" id="e_apply">Aplicar</button><span class="small muted" id="e_msg"></span></div></div>`
  fillEstilo(await (await fetch(`/api/estilo?${q({ entrega: nombre })}`)).json())
  variante = 0
  cuerpo.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { fillEstilo(CAT.presets[b.dataset.p]); $('#e_info').innerHTML = ''; $('#e_msg').textContent = '' })
  cuerpo.querySelectorAll('details input, details select').forEach((el) => el.addEventListener('input', () => { estiloActual = { ...estiloActual, nombre: 'personalizado' }; delete estiloActual.semilla; marcarChip() }))
  $('#e_var').onclick = async () => {
    variante++
    const r = await post('/api/estilo/variar', { entrega: nombre, semilla: variante === 1 ? nombre : `${nombre}#${variante}` })
    fillEstilo(await r.json()); $('#e_info').innerHTML = ''; $('#e_msg').textContent = 'Propuesta lista. Pulsa Aplicar para usarla.'
  }
  $('#e_ej').onchange = async (ev) => {
    const f = ev.target.files[0]; ev.target.value = ''
    if (!f) return
    $('#e_msg').textContent = 'Leyendo el ejemplo…'
    const fd = new FormData(); fd.append('file', f, f.name)
    const r = await fetch('/api/estilo/extraer', { method: 'POST', body: fd }); const j = await r.json()
    if (!r.ok) { $('#e_msg').innerHTML = `<span class="lint-e">${esc(j.message || 'No se pudo leer')}</span>`; return }
    fillEstilo(j.estilo)
    $('#e_msg').textContent = 'Tomado del ejemplo. Revísalo y pulsa Aplicar.'
    $('#e_info').innerHTML = `<details open><summary>Lo que se leyó de ${esc(f.name)}</summary><ul class="clean small">${j.detectado.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${j.incierto.length ? `<p class="note">No se pudo asegurar:</p><ul class="clean small muted">${j.incierto.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</details>`
  }
  $('#e_apply').onclick = async () => {
    const b = $('#e_apply'); b.disabled = true; $('#e_msg').textContent = 'Aplicando…'
    const r = await fetch('/api/estilo', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ entrega: nombre, estilo: collectEstilo() }) })
    const j = await r.json(); b.disabled = false
    if (!r.ok) { $('#e_msg').textContent = j.message || 'No se pudo aplicar'; return }
    fillEstilo(j.estilo)
    await refresh(true)
    if (j.ensamblado) { view.tab = 'documento'; pintarEntrega(true) } // se ve el resultado
    else $('#e_msg').textContent = 'Guardado. Se usará al ensamblar la entrega.'
  }
}
function marcarChip() { document.querySelectorAll('#chips [data-p]').forEach((b) => b.classList.toggle('on', estiloActual && estiloActual.nombre === b.dataset.p)) }
function fillEstilo(e) {
  estiloActual = e
  F.forEach((k) => { $('#e_' + k).value = e[k] })
  $('#e_colorTitulos').value = '#' + e.colorTitulos.toLowerCase()
  $('#e_numeracion').checked = !!e.numeracion; $('#e_saltoActividad').checked = !!e.saltoActividad
  G.forEach((k) => { $('#g_' + k).value = e.grafica[k] })
  marcarChip()
}
function collectEstilo() {
  const e = { nombre: estiloActual?.nombre || 'personalizado', grafica: {} }
  if (estiloActual?.semilla) e.semilla = estiloActual.semilla
  F.forEach((k) => { e[k] = $('#e_' + k).value })
  e.colorTitulos = $('#e_colorTitulos').value.replace('#', '')
  e.numeracion = $('#e_numeracion').checked; e.saltoActividad = $('#e_saltoActividad').checked
  G.forEach((k) => { e.grafica[k] = $('#g_' + k).value })
  return e
}

// ───────── Subir ─────────
const pad2 = (n) => String(n).padStart(2, '0')
const nombreAuto = () => { const n = new Date(); return `entrega-${n.getFullYear()}${pad2(n.getMonth() + 1)}${pad2(n.getDate())}-${pad2(n.getHours())}${pad2(n.getMinutes())}${pad2(n.getSeconds())}` }
async function upload(files) {
  if (!files.length) return
  let nombre = $('#entrega').value.trim()
  const zips = files.filter((f) => /\.zip$/i.test(f.name))
  if (!nombre) nombre = zips.length === 1 && zips.length === files.length ? zips[0].name.replace(/\.zip$/i, '') : nombreAuto()
  $('#upmsg').textContent = `Subiendo y convirtiendo ${files.length} archivo(s)…`
  const fd = new FormData(); fd.append('entrega', nombre)
  for (const f of files) fd.append('files', f, f.name)
  try {
    const r = await fetch('/api/subir', { method: 'POST', body: fd }); const j = await r.json()
    if (!r.ok) { $('#upmsg').innerHTML = `<span class="w">${esc(j.message || 'Error al subir')}</span>`; return }
    const n = j.resultados.reduce((a, x) => a + x.guardadas.length, 0)
    $('#upmsg').innerHTML = `${n} hoja(s) en «${esc(nombre)}».` + j.resultados.flatMap((x) => x.avisos).map((a) => `<div class="w">${esc(a)}</div>`).join('')
    $('#entrega').value = ''
  } catch (e) { $('#upmsg').innerHTML = `<span class="w">No se pudo subir: ${esc(e.message)}</span>` }
  refresh(true)
}
const drop = $('#drop'), inp = $('#file')
drop.onclick = () => inp.click()
inp.onchange = () => { upload([...inp.files]); inp.value = '' }
;['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over') }))
;['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over') }))
drop.addEventListener('drop', (e) => upload([...e.dataTransfer.files]))

for (const [id, tipo, etiqueta] of [['#btnPrompt', '', 'Prompt: una hoja'], ['#btnLote', 'lote', 'Prompt: lote'], ['#btnOrq', 'orquestador', 'Prompt: orquestador'], ['#btnCon', 'contraste', 'Prompt: contraste']]) {
  $(id).onclick = async () => {
    const t = await (await fetch('/api/prompt' + (tipo ? '?tipo=' + tipo : ''))).text()
    try { await navigator.clipboard.writeText(t); $(id).textContent = '¡Copiado!' } catch { prompt('Copia este texto:', t) }
    setTimeout(() => $(id).textContent = etiqueta, 1800)
  }
}

refresh(true); setInterval(() => refresh(false), 4000)
</script>
