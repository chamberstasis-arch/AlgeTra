services:
  # API: carga de imágenes, cola hacia Mathpix, exportación DOCX e informe de precisión.
  algetra-api:
    build:
      context: .
      target: development
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      CHOKIDAR_USEPOLLING: "true"
      PORT: "3001"
      DATA_DIR: /app/data
    volumes:
      - .:/app
      - algetra_node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev:server"

  algetra-dev:
    build:
      context: .
      target: development
    init: true
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_URL: http://algetra-api:3001
    depends_on:
      - algetra-api
    volumes:
      - .:/app
      - algetra_node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"

  algetra-production:
    build:
      context: .
      target: production
    profiles:
      - production
    init: true
    ports:
      - "8080:80"
    depends_on:
      - algetra-api

volumes:
  algetra_node_modules:
